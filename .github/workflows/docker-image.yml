name: Docker image

# Builds the NyxStrike container (docker/Dockerfile) and pushes it to the GitHub
# Container Registry (GHCR). Replaces the GitLab BuildKit pipeline that pushed to
# the internal Harbor. See the commented "Harbor" steps below to additionally
# push to an internal Harbor registry once its secrets are configured.

on:
  push:
    branches: [master, main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"     # e.g. 1.9.0  (upstream tag style)
      - "v[0-9]+.[0-9]+.[0-9]+"    # e.g. v1.9.0
  workflow_dispatch:

env:
  # Primary registry: GHCR works out of the box with GITHUB_TOKEN, no extra
  # secrets. The cyber-range can pull from here or mirror the image to Harbor.
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Optional: also push to an internal Harbor registry ───────────────────
      # Uncomment and set repo secrets HARBOR_HOST / HARBOR_USER / HARBOR_PASSWORD
      # (and add "${{ secrets.HARBOR_HOST }}/nyxstrike" to the metadata images
      # list below) to publish to Harbor in the same run.
      #
      # - name: Log in to Harbor
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.HARBOR_HOST }}
      #     username: ${{ secrets.HARBOR_USER }}
      #     password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
