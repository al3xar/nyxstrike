name: Docker image

# Builds the NyxStrike container (docker/Dockerfile) and pushes it to OUR Harbor
# registry so the cyber-range can pull it. The Hades chart's `nyxstrike-mcp`
# sidecar pulls this exact ref (see repos/.../hades/values-hades.yaml):
#
#     harbor.athena.cibertrs.cloud/athena-dev/nyxstrike:latest
#
# ── Required repo secrets ────────────────────────────────────────────────────
# Settings → Secrets and variables → Actions → New repository secret:
#   HARBOR_USERNAME  — Harbor robot account (e.g. "robot$athena-dev+github")
#   HARBOR_PASSWORD  — that robot account's token/secret
#
# ── Runner reachability ──────────────────────────────────────────────────────
# This uses a GitHub-hosted runner, which must be able to reach
# harbor.athena.cibertrs.cloud over the network. If Harbor is only reachable
# from inside the cluster, register a self-hosted runner there and change
# `runs-on:` below (see the commented line). The old GitLab pipeline built
# in-cluster for exactly this reason.

on:
  push:
    branches: [master, main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"     # e.g. 1.9.0
      - "v[0-9]+.[0-9]+.[0-9]+"    # e.g. v1.9.0
  workflow_dispatch:

env:
  IMAGE: harbor.athena.cibertrs.cloud/athena-dev/nyxstrike
  REGISTRY: harbor.athena.cibertrs.cloud

jobs:
  build:
    name: Build & push to Harbor
    runs-on: ubuntu-latest
    # If Harbor is only reachable in-cluster, use a self-hosted runner instead:
    #   runs-on: [self-hosted, linux, cyber-range]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
