name: Docker image

# Builds the NyxStrike container (docker/Dockerfile) and pushes it to the GitHub
# Container Registry (GHCR): ghcr.io/<owner>/nyxstrike. Authenticated with the
# built-in GITHUB_TOKEN — NO external registry credentials.
#
# Make it pullable by the cyber-range:
#   1. After the first successful run, set the package public (repo → Packages →
#      nyxstrike → Package settings → Change visibility), or add a GHCR pull
#      secret in the cluster.
#   2. Point the deployment image ref at ghcr.io/<owner>/nyxstrike:latest
#      (currently the Hades sidecar values still reference Harbor — update those
#      deploy repos separately).

on:
  push:
    branches: [master, main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"     # e.g. 1.9.0
      - "v[0-9]+.[0-9]+.[0-9]+"    # e.g. v1.9.0
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
